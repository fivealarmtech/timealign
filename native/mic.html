<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimeAlign live mic</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a3340; --text:#e6edf3; --dim:#8b98a7; --accent:#ffb547; --blue:#4fc3f7; --good:#5fd38d; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; margin: 4px 0 2px; } h1 span { color: var(--accent); }
  .dim { color: var(--dim); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 14px 0; }
  button { width: 100%; font: 700 18px/1 inherit; padding: 18px; border-radius: 12px; border: 0; background: var(--accent); color: #1b1300; }
  button.stop { background: #3a1416; color: #ffb3b3; border: 1px solid #7a2328; }
  .meter { height: 22px; border-radius: 6px; background: #1c232d; overflow: hidden; border: 1px solid var(--line); margin-top: 8px; }
  .meter div { height: 100%; width: 0; background: linear-gradient(90deg, #2e7d32, #9ccc65 70%, #ffd54f 88%, #ff5252); transition: width .08s; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--dim); margin-top: 6px; }
  #mac { font: 600 17px/1.35 -apple-system, sans-serif; color: var(--blue); white-space: pre-wrap; min-height: 2.6em; }
  #err { color: var(--bad); font-size: 14px; white-space: pre-wrap; }
  .ok { color: var(--good); }
</style>
</head>
<body>
  <h1><span>⟂</span> TimeAlign live mic</h1>
  <div class="dim">This iPhone streams its microphone to TimeAlign on your Mac.</div>
  <div class="card">
    <button id="go">Start microphone</button>
    <div class="meter"><div id="bar"></div></div>
    <div class="row"><span id="lvl">— dBFS</span><span id="net">not connected</span></div>
  </div>
  <div class="card">
    <div class="dim">From the Mac</div>
    <div id="mac">Tap “Start microphone”.</div>
  </div>
  <div id="err"></div>
  <div class="dim">Keep this screen open while measuring (the screen stays on). Point the mic toward the stage at ear height; don’t cover the bottom of the phone.</div>
<script>
(() => {
  'use strict';
  const FS = 48000, CHUNK = 2048;
  const qs = new URLSearchParams(location.search);
  const key = qs.get('k') || '';
  const $ = (id) => document.getElementById(id);
  let ctx = null, stream = null, node = null, wake = null, running = false;
  const queue = [];            // {f, pcm: Int16Array}
  let sending = false, sentFrames = 0, lastOk = 0, fails = 0;

  const worklet = `
    class Cap extends AudioWorkletProcessor {
      constructor() { super(); this.buf = new Float32Array(${CHUNK}); this.n = 0; this.f0 = 0; }
      process(inputs) {
        const ch = inputs[0] && inputs[0][0];
        if (ch) {
          let off = 0;
          while (off < ch.length) {
            if (this.n === 0) this.f0 = currentFrame + off;
            const k = Math.min(ch.length - off, ${CHUNK} - this.n);
            this.buf.set(ch.subarray(off, off + k), this.n); this.n += k; off += k;
            if (this.n === ${CHUNK}) { this.port.postMessage({ f: this.f0, a: this.buf }, [this.buf.buffer]); this.buf = new Float32Array(${CHUNK}); this.n = 0; }
          }
        }
        return true;
      }
    }
    registerProcessor('cap', Cap);`;

  function onChunk(f, a) {
    let pk = 0, ss = 0;
    const pcm = new Int16Array(a.length);
    for (let i = 0; i < a.length; i++) {
      const v = a[i]; ss += v * v; const av = v < 0 ? -v : v; if (av > pk) pk = av;
      pcm[i] = Math.max(-32767, Math.min(32767, Math.round(v * 32767)));
    }
    const rms = 10 * Math.log10(ss / a.length + 1e-12);
    $('bar').style.width = Math.max(0, Math.min(100, (rms + 70) / 70 * 100)) + '%';
    $('lvl').textContent = `mic ${rms.toFixed(0)} dBFS` + (pk > 0.9 ? '  CLIP' : '');
    queue.push({ f, pcm });
    if (queue.length > 400) queue.splice(0, queue.length - 400);   // ~17 s backlog max
    pump();
  }

  async function pump() {
    if (sending) return;
    sending = true;
    while (queue.length && running) {
      // send up to 8 contiguous chunks in one request
      const batch = [queue[0]];
      for (let i = 1; i < queue.length && batch.length < 8; i++) {
        if (queue[i].f !== batch[batch.length - 1].f + CHUNK) break;
        batch.push(queue[i]);
      }
      const n = batch.length * CHUNK, body = new Int16Array(n);
      batch.forEach((c, i) => body.set(c.pcm, i * CHUNK));
      try {
        const r = await fetch(`/audio?k=${encodeURIComponent(key)}&f=${batch[0].f}`, {
          method: 'POST', body: body.buffer, headers: { 'Content-Type': 'application/octet-stream' }, cache: 'no-store' });
        if (r.status === 403) { $('err').textContent = 'This QR code is from an older session. Scan the code on the Mac again.'; stop(); break; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        queue.splice(0, batch.length);
        sentFrames += n; lastOk = performance.now(); fails = 0;
        const j = await r.json().catch(() => ({}));
        if (j.status != null) $('mac').textContent = j.status;
        $('net').innerHTML = '<span class="ok">● streaming to Mac</span>';
        $('err').textContent = '';
      } catch (e) {
        fails++;
        $('net').textContent = 'reconnecting…';
        if (fails > 3) $('err').textContent = 'Can’t reach the Mac. Same Wi-Fi? Is TimeAlign open with “iPhone (live)” selected?';
        await new Promise((res) => setTimeout(res, Math.min(2000, 200 * fails)));
      }
    }
    sending = false;
  }

  async function start() {
    $('err').textContent = '';
    try {
      ctx = new AudioContext({ sampleRate: FS });
      if (ctx.sampleRate !== FS) throw new Error(`Audio is running at ${ctx.sampleRate} Hz; TimeAlign needs 48 kHz.`);
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
      const src = ctx.createMediaStreamSource(stream);
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: 'application/javascript' })));
      node = new AudioWorkletNode(ctx, 'cap', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1] });
      node.port.onmessage = (ev) => onChunk(ev.data.f, ev.data.a);
      const mute = ctx.createGain(); mute.gain.value = 0;
      src.connect(node); node.connect(mute); mute.connect(ctx.destination);
      if (ctx.state !== 'running') await ctx.resume();
      running = true;
      try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) { /* optional */ }
      $('go').textContent = 'Stop microphone'; $('go').className = 'stop';
      $('mac').textContent = 'Connecting to the Mac…';
    } catch (e) {
      $('err').textContent = (e && e.name === 'NotAllowedError')
        ? 'Microphone permission was blocked. Allow the microphone for this page (aA menu → Website Settings), then try again.'
        : 'Could not start the microphone: ' + (e && e.message ? e.message : e);
      stop();
    }
  }
  function stop() {
    running = false;
    try { if (stream) stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
    try { if (ctx) ctx.close(); } catch (e) {}
    try { if (wake) wake.release(); } catch (e) {}
    ctx = null; stream = null; node = null; wake = null; queue.length = 0;
    $('go').textContent = 'Start microphone'; $('go').className = '';
    $('net').textContent = 'not connected';
  }
  $('go').onclick = () => (running ? stop() : start());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running && navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then((w) => { wake = w; }).catch(() => {});
  });
  window.__mic = { get sentFrames() { return sentFrames; }, get queued() { return queue.length; } };
})();
</script>
</body>
</html>
