name: Build Mac app + iPhone page
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  mac-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build TimeAlign.app (native Swift + Core Audio)
        shell: bash
        run: |
          set -o pipefail
          bash native/build.sh 2>&1 | tee build.log
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: TimeAlign 2.0 (build ${{ github.run_number }})
          make_latest: true
          body: |
            Native Mac app (Apple Silicon + Intel, macOS 11+). Download **TimeAlign.dmg**, open it, drag TimeAlign to Applications.
            First launch: System Settings > Privacy & Security > "Open Anyway" (the app isn't notarized by Apple).
          fail_on_unmatched_files: false
          files: |
            dist/TimeAlign.dmg
            dist/TimeAlign-mac.zip
      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || echo "no build.log" > /tmp/build.log
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "build log for run ${{ github.run_number }}"
          git push -f origin ci-log
  iphone-page:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
